name: Verificacoes locais
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - run: python aplicativo/qa/test_servidor.py
      - run: node aplicativo/qa/test-text.cjs
      - run: node aplicativo/qa/test-session.cjs
      - run: node aplicativo/qa/test-player.cjs
      - name: Verificar sintaxe JavaScript
        run: |
          for file in aplicativo/public/*.js aplicativo/qa/*.cjs; do node --check "$file"; done
